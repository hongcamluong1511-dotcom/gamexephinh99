<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thử Thách Xếp Hình - Mèo Con</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(140deg,#87d7ff,#d7f7b0 50%,#ffc879);font-family:system-ui,Arial;color:#39230f;display:flex;justify-content:center;align-items:center;padding:18px}
main{width:min(100%,760px);background:#fff5dc;border:5px solid #9b5c22;border-radius:24px;padding:18px;box-shadow:0 12px 0 #6f411d,0 20px 45px #294e3870}
h1{text-align:center;font-size:clamp(25px,5vw,38px);margin:0 0 5px;color:#a94c0b;text-shadow:1px 2px #ffd978} .sub{text-align:center;margin:0 0 14px;color:#77512e}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{background:#78421d;color:white;border-radius:12px;padding:8px;text-align:center}.stat small{display:block;color:#ffe2a4}.stat strong{font-size:20px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:8px;background:#79451f;border:4px solid #c8833a;border-radius:16px;max-width:520px;margin:auto;aspect-ratio:1}
.tile{border:2px solid #ffdf9d;border-radius:8px;background-image:var(--puzzle-image);background-size:400% 400%;cursor:pointer;min-width:0;min-height:0;box-shadow:0 2px 0 #4d2a15;transition:transform .12s}.tile:hover{filter:brightness(1.08)}.tile.empty{background:#3d2517;border:2px solid #5b361b;box-shadow:inset 0 0 12px #170d07;cursor:default}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px auto 0;max-width:520px}.btn{padding:12px;border:0;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;color:white;box-shadow:0 4px 0 #0002}.shuffle{background:#20ad46}.reset{background:#2187ec}.message{text-align:center;min-height:26px;margin-top:12px;font-weight:750;color:#9b4a0b}

.picker-title{font-weight:850;text-align:center;margin:8px 0;color:#80400f}
.image-picker{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:520px;margin:0 auto 12px}
.image-choice{padding:5px;border:3px solid #d6b17d;border-radius:12px;background:#fff8e9;color:#57351a;font-weight:800;cursor:pointer;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:13px}
.image-choice.active{border-color:#1caa4b;background:#e4ffdb;box-shadow:0 0 0 2px #1caa4b33}
.thumb{display:block;width:100%;aspect-ratio:1.6;border-radius:7px;background-size:cover;background-position:center}

let currentPicture="kitten";
function choosePicture(name){if(!pictures[name])return;currentPicture=name;board.style.setProperty('--puzzle-image','url("'+pictures[name]+'")');document.querySelectorAll('.image-choice').forEach(btn=>{let active=btn.dataset.image===name;btn.classList.toggle('active',active);btn.setAttribute('aria-pressed',String(active))});shuffle();msg.textContent='Đã chọn hình mới! Hãy ghép tranh nhé.'}

function updateTime(){timeEl.textContent=fmt(Math.floor(secs/60))+':'+fmt(secs%60)}
function start(){if(!timer){started=true;timer=setInterval(()=>{secs++;updateTime()},1000)}}
function stop(){clearInterval(timer);timer=null}
function adjacent(i,z){return Math.abs(i-z)===4||(Math.floor(i/4)===Math.floor(z/4)&&Math.abs(i-z)===1)}
function render(){board.innerHTML='';a.forEach((v,i)=>{let b=document.createElement('button');b.className='tile'+(!v?' empty':'');b.setAttribute('aria-label',v?'Mảnh ghép '+v:'Ô trống');if(v){let original=v-1,x=original%4,y=Math.floor(original/4);b.style.backgroundPosition=(x/3*100)+'% '+(y/3*100)+'%'}else b.style.backgroundImage='none';b.disabled=!v||finished||!adjacent(i,a.indexOf(0));b.onclick=()=>move(i);board.appendChild(b)});movesEl.textContent=moves}
function win(){finished=true;stop();msg.textContent='🎉 Tuyệt vời! Bạn đã ghép xong trong '+moves+' bước!';try{let old=Number(localStorage.getItem('catPuzzleBest')||0);if(!old||secs<old){localStorage.setItem('catPuzzleBest',secs);loadBest()}}catch(e){}render()}
function move(i){if(finished||!adjacent(i,a.indexOf(0)))return;start();let z=a.indexOf(0);[a[i],a[z]]=[a[z],a[i]];moves++;render();if(a.every((v,i)=>v===goal[i]))win()}
function fresh(){stop();secs=0;moves=0;finished=false;started=false;updateTime();msg.textContent='Bấm vào mảnh ghép cạnh ô trống để di chuyển.'}
function shuffle(){fresh();a=goal.slice();let prev=-1;for(let n=0;n<220;n++){let z=a.indexOf(0),opts=[z-4,z+4,z%4?z-1:-1,z%4<3?z+1:-1].filter(i=>i>=0&&i<16&&i!==prev);let k=opts[Math.floor(Math.random()*opts.length)];[a[z],a[k]]=[a[k],a[z]];prev=z}if(a.every((v,i)=>v===goal[i]))return shuffle();render()}
function reset(){fresh();a=goal.slice();render();msg.textContent='Đã đặt lại hình. Nhấn Trộn lại để chơi!'}
function loadBest(){try{let n=Number(localStorage.getItem('catPuzzleBest')||0);bestEl.textContent=n?fmt(Math.floor(n/60))+':'+fmt(n%60):'—'}catch(e){bestEl.textContent='—'}}
document.querySelectorAll('.image-choice').forEach(btn=>btn.addEventListener('click',()=>choosePicture(btn.dataset.image)));\nboard.style.setProperty('--puzzle-image','url("'+pictures.kitten+'")');\ndocument.querySelector('#shuffle').onclick=shuffle;document.querySelector('#reset').onclick=reset;
document.addEventListener('keydown',e=>{let z=a.indexOf(0),i=-1;if(e.key==='ArrowUp')i=z+4;if(e.key==='ArrowDown')i=z-4;if(e.key==='ArrowLeft'&&z%4<3)i=z+1;if(e.key==='ArrowRight'&&z%4>0)i=z-1;if(i>=0&&i<16){e.preventDefault();move(i)}});

})();
